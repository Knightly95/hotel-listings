name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # The Cypress binary is not needed here; see the roadmap in the README.
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests with coverage
        run: npm test -- --coverageReporters=json-summary --coverageReporters=text-summary

      - name: Build static site
        run: npm run build
        env:
          STATIC_EXPORT: true
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # Stops GitHub Pages from ignoring the _next directory.
      - run: touch out/.nojekyll

      # Published with the site and read by the shields.io badge in the README.
      - name: Coverage badge data
        run: node scripts/coverage-badge.mjs coverage/coverage-summary.json out/coverage-badge.json

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: out

  # Builds the app served from the root and checks what visitors get:
  # Lighthouse scores and the size of the JavaScript sent to the browser.
  quality:
    name: Lighthouse and bundle size
    runs-on: ubuntu-24.04
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          STATIC_EXPORT: true

      - name: Bundle-size budget
        run: node scripts/bundle-budget.mjs out 465

      - name: Lighthouse
        run: npx -y @lhci/cli@0.15.1 autorun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
